<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>403 Forbidden - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar {
            background: linear-gradient(90deg, #1a1a2e, #0f3460);
        }

        .navbar-brand {
            font-weight: 800;
            color: #e94560 !important;
            font-size: 1.4rem;
        }

        .error-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
        }

        .text-danger-brand {
            color: #e94560;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card error-card">
                    <div class="card-body p-5 text-center">
                        <div class="display-1 text-danger-brand">403</div>
                        <h3 class="fw-bold mb-3">접근 권한 없음</h3>
                        <p class="text-muted mb-4">해당 페이지에 접근할 권한이 없습니다.</p>

                        <div th:if="${#authentication?.principal?.username != 'anonymousUser'}" class="mb-4">
                            <small class="text-muted">현재 로그인된 계정: <b
                                    th:text="${#authentication.principal.username}"></b></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <footer>
        <p
            th:text="${' │  학번: 2171107  │  성명: 김도윤 │ ' + '실습 수행: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}">
        </p>
    </footer>
</body>

</html>
