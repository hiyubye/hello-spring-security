<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: 800;
            color: #e94560;
            letter-spacing: -1px;
        }

        .btn-success-custom {
            background: #22c55e;
            border-color: #22c55e;
            color: #fff;
        }

        .btn-success-custom:hover {
            background: #16a34a;
            border-color: #16a34a;
            color: #fff;
        }

        .form-control:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 0.2rem rgba(233, 69, 96, .25);
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-sm-8 col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="brand-logo">HanSung</div>
                            <p class="text-muted mt-1 mb-0">비밀번호 변경</p>
                        </div>

                        <form th:action="@{/user/password}" th:object="${passWordChangeDto}" method="post">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">현재 비밀번호 <span class="text-danger">*</span></label>
                                <input type="password" th:field="*{currentPassword}" class="form-control"
                                    th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                                    placeholder="현재 비밀번호를 입력하세요" />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}"
                                    th:errors="*{currentPassword}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">새 비밀번호 <span class="text-danger">*</span></label>
                                <input type="password" th:field="*{newPassword}" class="form-control"
                                    th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                                    placeholder="새 비밀번호를 입력하세요 (최소 4자)" />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}"
                                    th:errors="*{newPassword}"></div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">새 비밀번호 확인 <span
                                        class="text-danger">*</span></label>
                                <input type="password" th:field="*{confirmPassword}" class="form-control"
                                    th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                    placeholder="새 비밀번호를 한 번 더 입력하세요" />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                                    th:errors="*{confirmPassword}"></div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success-custom btn-lg w-100 fw-semibold">비밀번호
                                    변경</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p
                th:text="${' │  학번: 2171107  │  성명: 김도윤 │ ' + '실습 수행: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}">
            </p>
        </footer>
</body>

</html>
